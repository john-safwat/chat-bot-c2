name: Distribute Android Build to Firebase

on:
  pull_request:
    branches:
      - main

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Debug APK path
        run: ls -l ./build/app/outputs/flutter-apk/

      - name: Check if APK exists
        run: |
          if [ -f ./build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "APK file exists."
          else
            echo "APK file NOT found!" && exit 1
          fi

      - name: Upload and Distribute App
        uses: mastersam07/firebase-app-distribution-action@v0.1
        with:
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          appId: ${{ secrets.FIREBASE_APP_ID }}
          file: './build/app/outputs/flutter-apk/app-release.apk'  # e.g., './build/app/outputs/flutter-apk/app-release.apk'
          groups: 'internal-testers'
