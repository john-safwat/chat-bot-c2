name: flutter-test-action

on:
  push:
  pull_request:

jobs:
  flutter-test-action:
    runs-on: ubuntu-latest

    steps:

      - run: |
          echo "running flutter test code"
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.2
      - run: flutter --version
      - run: flutter pub get
      - name: Run test
        run: flutter test